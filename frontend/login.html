<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | NidhiRoute AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f3f7fc;color:#12233f}.wrap{min-height:100vh;display:grid;place-items:center;padding:25px}.box{width:min(460px,100%);background:#fff;border:1px solid #d9e3ef;border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(25,55,95,.12)}h1{margin:0 0 8px}.brand{font-weight:900;font-size:22px;color:#0a1f44;margin-bottom:30px}.brand span{color:#2ac98b}label{display:block;font-weight:800;margin:16px 0 7px}input{width:100%;padding:14px;border:1px solid #cbd7e7;border-radius:11px;font-size:16px}button,.btn{width:100%;padding:14px;border:0;border-radius:11px;background:#2463eb;color:#fff;font-weight:900;font-size:16px;cursor:pointer;margin-top:18px}.switch{margin-top:18px;text-align:center;color:#5c708d}.switch a{color:#2463eb;font-weight:800}.msg{margin-top:15px;padding:12px;border-radius:10px;display:none}.error{background:#fff0f0;color:#a51f1f}.success{background:#edfff5;color:#08743e}.back{display:inline-block;margin-bottom:22px;color:#2463eb;font-weight:800}</style></head><body><div class="wrap"><div class="box"><a class="back" href="index.html">← Back to NidhiRoute AI</a><div class="brand">NidhiRoute <span>AI</span></div><h1 id="title">Sign in</h1><p id="subtitle">Login to access your funding dashboard.</p><div id="form"></div><div id="msg" class="msg"></div><div class="switch" id="switch">New applicant? <a href="#" onclick="showSignup();return false">Create an account</a></div></div></div><script>const API=localStorage.getItem('NIDHI_API')||'http://localhost:5000/api';let mode='login';function render(){document.getElementById('title').textContent=mode==='login'?'Sign in':'Create account';document.getElementById('subtitle').textContent=mode==='login'?'Login to access your funding dashboard.':'Create your NidhiRoute applicant account.';document.getElementById('form').innerHTML=mode==='login'?`<label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button onclick="submitAuth()">Login</button>`:`<label>Applicant name</label><input id="name" required><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><button onclick="submitAuth()">Create account</button>`;document.getElementById('switch').innerHTML=mode==='login'?`New applicant? <a href="#" onclick="showSignup();return false">Create an account</a>`:`Already registered? <a href="#" onclick="showLogin();return false">Sign in</a>`}function showSignup(){mode='signup';render()}function showLogin(){mode='login';render()}async function submitAuth(){const msg=document.getElementById('msg');msg.style.display='none';const emailInput=document.getElementById('email');const passwordInput=document.getElementById('password');const nameInput=document.getElementById('name');let body=mode==='login'?{email:emailInput.value.trim(),password:passwordInput.value}:{name:nameInput.value.trim(),email:emailInput.value.trim(),password:passwordInput.value};try{const r=await fetch(API+(mode==='login'?'/auth/login':'/auth/signup'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const ct=r.headers.get('content-type')||''; const data=ct.includes('application/json')?await r.json():{message:'Backend API was not found. Start the NidhiRoute backend on port 5000 and try again.'}; if(!r.ok)throw new Error(data.message||'Unable to complete request');localStorage.setItem('NIDHI_SESSION',data.token);localStorage.setItem('NIDHI_USER',JSON.stringify(data.user));msg.className='msg success';msg.textContent=mode==='login'?'Login successful.':'Account created successfully.';msg.style.display='block';setTimeout(()=>{const next=new URLSearchParams(location.search).get('next');location.href=next||'dashboard.html'},500)}catch(e){msg.className='msg error';msg.textContent=e.message;msg.style.display='block'}}render();</script></body></html>
