<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | NidhiRoute AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f3f7fc;color:#12233f}header{background:#0a1f44;color:#fff;padding:13px 5%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:24px}.brand span{color:#37d59c}.menu{border:0;background:#fff;color:#0a1f44;border-radius:10px;font-size:23px;width:42px;height:38px;cursor:pointer}main{max-width:1180px;margin:auto;padding:38px 5%}.welcome{display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap}h1{font-size:38px;margin:0 0 6px}.muted{color:#647791}.hero{background:linear-gradient(135deg,#eaf2ff,#fff);border:1px solid #dbe5f2;border-radius:22px;padding:28px;margin:28px 0}.btn{display:inline-block;padding:13px 18px;border-radius:11px;background:#2463eb;color:#fff;font-weight:900;border:0;cursor:pointer}.search{display:flex;gap:10px;margin:22px 0 15px}.search input,.search select{padding:14px;border:1px solid #cbd7e7;border-radius:11px;background:#fff;font-size:15px}.search input{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.scheme{background:#fff;border:1px solid #d9e3ef;border-radius:18px;padding:20px}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#eaf2ff;color:#1e59cf;font-weight:800;font-size:12px}.scheme h3{font-size:18px;line-height:1.3}.apply{margin-top:15px;width:100%}.drawer{position:fixed;inset:0;background:rgba(5,20,44,.5);display:none;z-index:5}.drawer.open{display:block}.panel{height:100%;width:min(350px,90%);background:#fff;padding:25px}.panel a,.panel button{display:block;width:100%;padding:13px;margin:10px 0;border:0;border-radius:10px;background:#f2f6fb;text-align:left;font-weight:800;cursor:pointer}.close{float:right;background:none!important;font-size:25px!important;width:auto!important}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.search{flex-direction:column}}</style></head><body><header><div class="brand">NidhiRoute <span>AI</span></div><button class="menu" onclick="openMenu()">☰</button></header><div id="drawer" class="drawer" onclick="closeMenu(event)"><div class="panel" onclick="event.stopPropagation()"><button class="close" onclick="closeMenu()">×</button><h3>Menu</h3><a href="dashboard.html">Dashboard</a><a href="find-schemes.html" onclick="return applyLink(event)">Apply for Schemes</a><a href="index.html">Home</a><button onclick="logout()">Logout</button></div></div><main><div class="welcome"><div><h1>Welcome, <span id="name">Applicant</span></h1><p class="muted">Your funding dashboard</p></div><button class="btn" onclick="applyNow()">Apply for Schemes</button></div><section class="hero"><h2>Find the right funding scheme</h2><p class="muted">Search scholarships, fellowships, loans, venture support and credit guarantees.</p><button class="btn" onclick="applyNow()">Start Scheme Matching →</button></section><h2>Search schemes</h2><div class="search"><input id="q" placeholder="Search by scheme, purpose, type, keyword..." oninput="render()"><select id="purpose" onchange="render()"><option value="">All purposes</option><option>Education</option><option>Business</option></select><select id="type" onchange="render()"><option value="">All types</option><option>Scholarship</option><option>Fellowship</option><option>Loan</option><option>Venture Capital</option><option>Equity Support</option><option>Credit Guarantee</option><option>Microfinance</option></select></div><div class="grid" id="grid"></div></main><script>const API=localStorage.getItem('NIDHI_API')||'http://localhost:5000/api';const schemes=[
{"name":"Central Sector Scheme of Top Class Education for SC Students","key":"topclass-sc","type":"Scholarship","purpose":"Education","tags":"scholarship top class IIT IIM NIT AIIMS higher education","amount":"Up to notified scholarship limits","desc":"Merit-based support for eligible SC students in premier institutions."},

];function isLogged(){return !!localStorage.getItem('NIDHI_SESSION')}function applyLink(e){if(!isLogged()){e.preventDefault();location.href='login.html?next=find-schemes.html';return false}return true}function applyNow(key){const next=key?('apply-scheme.html?scheme='+encodeURIComponent(key)):'find-schemes.html';if(isLogged())location.href=next;else location.href='login.html?next='+encodeURIComponent(next)}function render(){const q=(document.getElementById('q').value||'').toLowerCase().trim(),p=document.getElementById('purpose').value,t=document.getElementById('type').value;const arr=schemes.filter(s=>(!p||s.purpose===p)&&(!t||s.type===t)&&(!q||(s.name+' '+s.purpose+' '+s.type+' '+s.tags+' '+s.desc).toLowerCase().includes(q)));document.getElementById('grid').innerHTML=arr.length?arr.map(s=>`<article class="scheme"><span class="tag">${s.type}</span><h3>${s.name}</h3><p class="muted">${s.desc}</p><p><b>${s.amount}</b></p><button class="btn apply" onclick="applyNow('${s.key}')">Apply for Schemes</button></article>`).join(''):'<p class="muted">No schemes found. Try another search term or filter.</p>'}function openMenu(){drawer.classList.add('open')}function closeMenu(e){if(e.target===drawer)drawer.classList.remove('open')}function logout(){localStorage.removeItem('NIDHI_SESSION');localStorage.removeItem('NIDHI_USER');location.href='index.html'}const u=JSON.parse(localStorage.getItem('NIDHI_USER')||'{}');document.getElementById('name').textContent=u.name||'Applicant';render();</script></body></html>
